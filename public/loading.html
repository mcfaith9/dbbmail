<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DBB Mail</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #09090b;
        color: #fafafa;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #27272a;
        border-top-color: #fafafa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .title {
        font-size: 14px;
        font-weight: 600;
      }

      .subtitle {
        font-size: 12px;
        color: #a1a1aa;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="loading">
      <div class="spinner"></div>

      <div class="title">
        DBB APP
      </div>

      <div class="subtitle">
        Preparing your workspace...
      </div>
    </div>
  </body>
</html>
